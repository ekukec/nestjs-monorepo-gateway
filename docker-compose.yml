version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: nestjs-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - nestjs-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build:
      context: .
      dockerfile: ./apps/authentication/Dockerfile
    container_name: nestjs-authentication
    restart: always
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/nestjs-challenge
      - AUTH_TCP_HOST=0.0.0.0
      - AUTH_TCP_PORT=3001
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nestjs-network

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    container_name: nestjs-gateway
    restart: always
    environment:
      - GATEWAY_PORT=3000
      - AUTH_TCP_HOST=authentication
      - AUTH_TCP_PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/nestjs-challenge
      - JWT_SECRET=secret
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
      authentication:
        condition: service_started
    networks:
      - nestjs-network

volumes:
  mongodb_data:
    driver: local

networks:
  nestjs-network:
    driver: bridge